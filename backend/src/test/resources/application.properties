# Configuración SOLO para tests.
#
# Por qué existe este archivo: src/test/resources/application.properties tiene
# PRIORIDAD sobre src/main/resources/application.properties (no se fusionan), así
# que todo lo que la aplicación necesita en el arranque debe estar también aquí.
#
# El objetivo es que BackendApplicationTests.contextLoads levante el contexto
# completo sin depender del RDS de la VPC (inalcanzable desde local / CI).
# H2 en memoria con MODE=PostgreSQL mantiene la fidelidad al motor real.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# El JWKS de Cognito es público: el decoder se construye sin red hasta que llega
# un token, así que esto no rompe el arranque en tests.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_LRpFUkCV2
app.oauth.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_LRpFUkCV2
app.oauth.audience=ccl9h8icl69iti2b4krufbcc5

# Mensajería: mismas claves que en producción; en tests no hay broker y la
# publicación degrada a warning.
mensajeria.exchange-solicitudes=solicitudes.topic
mensajeria.exchange-muerta=solicitudes.dlx
mensajeria.reintentos=3
mensajeria.solicitudes.creada.routing-key=solicitud.creada
mensajeria.solicitudes.creada.cola=notificaciones.solicitud-creada
mensajeria.solicitudes.creada.dlq=notificaciones.solicitud-creada.dlq
mensajeria.solicitudes.evaluada.routing-key=solicitud.evaluada
mensajeria.solicitudes.evaluada.cola=notificaciones.solicitud-evaluada
mensajeria.solicitudes.evaluada.dlq=notificaciones.solicitud-evaluada.dlq
mensajeria.solicitudes.auditoria.routing-key=solicitud.*
mensajeria.solicitudes.auditoria.cola=auditoria.solicitudes
mensajeria.solicitudes.auditoria.dlq=auditoria.solicitudes.dlq
